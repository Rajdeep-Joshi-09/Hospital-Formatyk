<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - LuxCare Premium Healthcare</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#fff8f7",
                        "outline-variant": "#e0bfbc",
                        "background": "#fff8f7",
                        "tertiary-fixed-dim": "#6fd8c7",
                        "inverse-primary": "#ffb3ae",
                        "primary": "#ac2b2e",
                        "on-secondary-container": "#656464",
                        "surface-variant": "#f6dddb",
                        "surface-tint": "#af2d30",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#008375",
                        "secondary-fixed-dim": "#c8c6c5",
                        "inverse-surface": "#3c2d2c",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-tertiary-container": "#f4fffb",
                        "on-tertiary-fixed": "#00201c",
                        "inverse-on-surface": "#ffedeb",
                        "primary-fixed-dim": "#ffb3ae",
                        "tertiary-fixed": "#8cf5e3",
                        "surface-container-high": "#fce2e0",
                        "secondary-container": "#e5e2e1",
                        "primary-fixed": "#ffdad7",
                        "surface-container-low": "#fff0ef",
                        "on-primary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#e5e2e1",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#8e121b",
                        "on-secondary-fixed-variant": "#474646",
                        "surface-container-highest": "#f6dddb",
                        "surface-container": "#ffe9e7",
                        "on-background": "#251817",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#251817",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#59413f",
                        "on-secondary": "#ffffff",
                        "surface": "#fff8f7",
                        "on-error": "#ffffff",
                        "primary-container": "#ce4343",
                        "on-tertiary-fixed-variant": "#005047",
                        "outline": "#8d706e",
                        "tertiary": "#00685c",
                        "secondary": "#5f5e5e",
                        "surface-dim": "#edd4d2",
                        "on-primary-fixed": "#410005",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "xs": "4px",
                        "section": "80px",
                        "xxl": "48px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Playfair Display"],
                        "headline-sm": ["Playfair Display"],
                        "display-lg-mobile": ["Playfair Display"],
                        "caption": ["Inter"],
                        "display-lg": ["Playfair Display"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-sm": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],

                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],

                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid #E7E7E7;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.04);
        }
        
        .floating-input {
            transition: all 0.2s ease-in-out;
        }
        
        .floating-input:focus + label,
        .floating-input:not(:placeholder-shown) + label {
            transform: translateY(-20px) scale(0.85);
            color: #ac2b2e;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface">
<!-- TopAppBar Suppressed due to Transactional Intent (Sign In) -->
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-md lg:p-xl relative overflow-hidden">
<!-- Subtle Background Elements -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-[20%] -right-[10%] w-[60%] h-[60%] rounded-full bg-surface-container-high/30 blur-3xl opacity-50 mix-blend-multiply"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-surface-container/30 blur-3xl opacity-50 mix-blend-multiply"></div>
</div>
<div class="w-full max-w-[480px] z-10">
<div class="glass-card rounded-[24px] p-[32px] md:p-xxl flex flex-col items-center">
<!-- Branding -->
<div class="mb-lg">
<span class="font-headline-sm text-headline-sm font-bold text-primary">LuxCare</span>
</div>
<!-- Headings -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Welcome to LuxCare</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access to your personal healthcare portal.</p>
</div>
<!-- Form -->
<form action="#" class="w-full flex flex-col gap-lg" method="POST">
<!-- Email Field -->
<div class="relative w-full">
<input class="floating-input peer w-full bg-surface-container-lowest border border-[#E7E7E7] rounded-lg px-md pt-lg pb-sm text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="absolute text-on-surface-variant left-md top-1/2 -translate-y-1/2 transition-all duration-200 pointer-events-none origin-left text-body-md font-body-md" for="email">Email Address</label>
</div>
<!-- Password Field -->
<div class="relative w-full">
<input class="floating-input peer w-full bg-surface-container-lowest border border-[#E7E7E7] rounded-lg px-md pt-lg pb-sm text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="absolute text-on-surface-variant left-md top-1/2 -translate-y-1/2 transition-all duration-200 pointer-events-none origin-left text-body-md font-body-md" for="password">Password</label>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full mt-[-8px]">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#D74A49] text-on-primary font-label-md text-label-md py-md rounded-[12px] mt-sm hover:bg-primary-container transition-colors duration-300 shadow-sm flex justify-center items-center gap-sm group" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-xl text-center w-full">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? <a class="text-primary hover:text-primary-container font-semibold transition-colors" href="#">Join LuxCare</a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-inverse-surface w-full mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center px-lg py-xl max-w-7xl mx-auto">
<div class="font-headline-sm text-headline-sm text-surface-bright mb-md md:mb-0">
                LuxCare
            </div>
<div class="flex flex-wrap justify-center gap-lg mb-md md:mb-0">
<a class="font-body-md text-body-md font-caption text-caption text-outline-variant hover:text-surface-bright transition-colors" href="#">Privacy Policy</a>
<a class="font-body-md text-body-md font-caption text-caption text-outline-variant hover:text-surface-bright transition-colors" href="#">Terms of Service</a>
<a class="font-body-md text-body-md font-caption text-caption text-outline-variant hover:text-surface-bright transition-colors" href="#">Accessibility</a>
<a class="font-body-md text-body-md font-caption text-caption text-outline-variant hover:text-surface-bright transition-colors" href="#">Cookie Policy</a>
</div>
<div class="font-body-md text-body-md font-caption text-caption text-outline-variant">
                © 2024 LuxCare Healthcare. All rights reserved.
            </div>
</div>
</footer>
</body></html>
